# Sestaví macOS .dmg na GitHubu (runner s Apple Silicon) a přidá ho k danému vydání.
# Spuštění: Actions → "Build macOS dmg" → Run workflow → zadat tag vydání (např. 1.2.8),
# nebo z terminálu: gh workflow run build-macos.yml -f tag=1.2.8
name: Build macOS dmg

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag vydání, ke kterému se dmg přidá (např. 1.2.8)"
        required: true

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-14
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HOMEBREW_NO_ENV_HINTS: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: pnpm
        run: |
          npm install -g pnpm@11.8.0
          pnpm config set store-dir "$HOME/.pnpm-store"

      - uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: pnpm-

      # mpv z Homebrew se instaluje souběžně se stavbou webu (šetří čas)
      - name: Web (veřejná edice) a mpv souběžně
        env:
          LUMEN_EDITION: public
          LUMEN_REPO_URL: https://github.com/${{ github.repository }}
        run: |
          brew install mpv dylibbundler & BREW_PID=$!
          (cd web && pnpm install --frozen-lockfile && pnpm build)
          wait $BREW_PID

      - name: Aplikace a dmg
        working-directory: macos
        env:
          VERSION: ${{ inputs.tag }}
        run: bash make-app.sh

      - name: Přidat dmg k vydání
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" "macos/dist/Lumen-${{ inputs.tag }}.dmg" --clobber
